<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- OCI Core。与 web/src/components/BrandMark.vue 同源，改一处要改两处
       ——favicon 引用不了 Vue 组件。
       这里用固定色而不是 currentColor：标签页底色由浏览器决定，
       白色圆角底自带地面，深浅两种标签栏上都看得清。 -->
  <defs>
    <linearGradient id="g" x1="4" y1="14" x2="28" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F04E23"/>
      <stop offset="1" stop-color="#22314F"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#fff"/>
  <path d="M4.5 14.5 A5.5 5.5 0 0 1 10.5 6.6 A7 7 0 0 1 23.5 8.2 A5 5 0 0 1 27.5 14.5"
        fill="none" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="11" cy="21" r="5.5" fill="none" stroke="#F04E23" stroke-width="2.8"/>
  <circle cx="21" cy="21" r="1.9" fill="#F04E23"/>
  <circle cx="26.5" cy="21" r="1.9" fill="#22314F" opacity="0.6"/>
</svg>
